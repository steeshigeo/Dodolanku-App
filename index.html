<!-- TAB PROGRESS (3 Columns Grid Breakdown) -->
<div class="grid-3">
    <div class="glass-card grid-card">
        <div class="label">🎯 Target Harian</div>
        <div class="val" id="dailyTargetText">Rp0</div>
        <div class="sub">Minimum / hari</div>
    </div>

    <!-- Item Terbanyak / Sering Dijual -->
    <div class="glass-card grid-card">
        <div class="label">🔥 Top Produk</div>
        <div class="val" id="topSellingProductText" title="-">-</div>
        <div class="sub" id="topSellingProductSub">0 Item Terjual</div>
    </div>

    <div class="glass-card grid-card">
        <div class="label">📈 Rata Sales</div>
        <div class="val" id="dailyAverageText">Rp0</div>
        <div class="sub" id="performanceCategoryText">Status Performa</div>
    </div>
</div>

<!-- MODAL PIN LOCK WITH NUMERIC KEYBOARD -->
<div class="modal" id="pinModal">
    <div class="glass-card modal-content" style="max-width:340px; text-align:center;">
        <div style="font-size:2.5rem; margin-bottom:4px;">🔒</div>
        <h3 style="font-size:1.1rem; margin-bottom:4px;">Lebokno sandine sek.</h3>
        <p style="font-size:0.78rem; color:var(--text-muted); margin-bottom:12px;">Masukkan 4-digit sandi untuk masuk ke Settings.</p>
        
        <div class="form-group">
            <input type="password" id="pinInputCode" class="form-input pin-input" maxlength="4" placeholder="••••" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>

        <p style="font-size:0.75rem; color:var(--text-muted); font-style:italic; margin-top:2px; margin-bottom:10px;">
            kalo gak tau tanya Frans ya sandinya, jangan di awur
        </p>

        <button class="btn-primary" id="btnSubmitPin">Masuk Settings</button>
        <button class="btn-secondary" id="btnClosePinModal" style="margin-top:4px;">Batal</button>
    </div>
</div>
